services:
  postgres:
    image: postgres:15-alpine
    container_name: medicloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicloud123}
      POSTGRES_DB: ${POSTGRES_DB:-medicloud_db}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicloud}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medicloud-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-medicloud_redis_secret}
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-medicloud_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
